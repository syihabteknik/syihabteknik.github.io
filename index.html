<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peta FTTH</title>
<style>
:root{--bg:#f8fafc;--fg:#0f172a;--mut:#64748b;--pn:#ffffff;--bd:#e2e8f0;--grid:#e2e8f0;--ac:#2563eb;--bad:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--fg:#e5e7eb;--mut:#94a3b8;--pn:#111a2e;--bd:#223049;--grid:#1a2740;--ac:#60a5fa;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1220;--fg:#e5e7eb;--mut:#94a3b8;--pn:#111a2e;--bd:#223049;--grid:#1a2740;--ac:#60a5fa;--bad:#f87171;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:var(--pn);border-bottom:1px solid var(--bd)}
header h1{font-size:15px;margin:0 8px 0 0}
button,select,input,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:5px 9px}
button{cursor:pointer}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sep{width:1px;height:22px;background:var(--bd);margin:0 4px}
main{flex:1;min-height:0;display:flex}
#wrap{flex:1;min-width:0;position:relative}
#c{width:100%;height:100%;display:block;touch-action:none}
#hint{position:absolute;left:10px;bottom:10px;background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:4px 9px;color:var(--mut);font-size:12px}
aside{width:290px;overflow:auto;background:var(--pn);border-left:1px solid var(--bd);padding:10px}
aside h2{font-size:13px;margin:12px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
aside h2:first-child{margin-top:0}
.row{display:flex;gap:6px;align-items:center;margin:4px 0}
.row label{width:70px;color:var(--mut)}
.row input{flex:1;min-width:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.warn{color:var(--bad)}
textarea{width:100%;height:80px;font:11px monospace}
@media (max-width:760px){main{flex-direction:column}aside{width:100%;height:42%;border-left:0;border-top:1px solid var(--bd)}}
</style>
</head>
<body>
<header>
  <h1>📡 Peta FTTH</h1>
  <button data-m="select">Pilih/Geser</button>
  <span class="sep"></span>
  <button data-m="odc">+ ODC</button>
  <button data-m="odp">+ ODP</button>
  <button data-m="cust">+ Pelanggan</button>
  <button data-m="pole">+ Tiang</button>
  <button data-m="jc">+ JC</button>
  <span class="sep"></span>
  <button data-m="link">Tarik kabel</button>
  <select id="kind"><option value="feeder">Feeder</option><option value="dist" selected>Distribusi</option><option value="drop">Drop</option></select>
  <button data-m="del">Hapus</button>
</header>
<main>
  <div id="wrap"><canvas id="c"></canvas><div id="hint"></div></div>
  <aside>
    <h2>Ringkasan</h2><div id="stats"></div>
    <h2>Terpilih</h2><div id="sel">Klik node pada mode Pilih.</div>
    <h2>Data (JSON)</h2>
    <textarea id="j" spellcheck="false" placeholder="Tempel JSON di sini lalu Muat"></textarea>
    <div class="row"><button id="exp">Ekspor</button><button id="imp">Muat</button><button id="rst">Contoh</button></div>
    <div id="msg" style="color:var(--mut);font-size:12px"></div>
  </aside>
</main>
<script>
const $=s=>document.querySelector(s), cv=$("#c"), ctx=cv.getContext("2d");
const T={odc:{c:"#ef4444",n:"ODC"},odp:{c:"#f59e0b",n:"ODP"},cust:{c:"#22c55e",n:"Pelanggan"},pole:{c:"#94a3b8",n:"Tiang"},jc:{c:"#a855f7",n:"JC"}};
const K={feeder:{c:"#ef4444",w:4,n:"Feeder"},dist:{c:"#f59e0b",w:2.5,n:"Distribusi"},drop:{c:"#22c55e",w:1.5,n:"Drop"}};
const HINT={select:"Seret node untuk memindah, seret kosong untuk geser peta, roda mouse untuk zoom.",link:"Klik node pertama lalu node kedua untuk menarik kabel.",del:"Klik node atau kabel untuk menghapus."};
const L0={lat:-6.2,lng:106.8}, CL=Math.cos(L0.lat*Math.PI/180);
let S={nodes:[],links:[],seq:1}, V={x:0,y:0,s:220000}, mode="select", sel=null, from=null, drag=null, W=0, H=0;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const w2s=(la,ln)=>[W/2+((ln-L0.lng)*CL-V.x)*V.s, H/2+(-(la-L0.lat)-V.y)*V.s];
const s2w=(x,y)=>({lng:L0.lng+((x-W/2)/V.s+V.x)/CL, lat:L0.lat-((y-H/2)/V.s+V.y)});
const byId=id=>S.nodes.find(n=>n.id===id);
function km(a,b){const R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dg=(b.lng-a.lng)*r;
  const h=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function used(n){const o=S.links.filter(l=>l.a===n.id||l.b===n.id).map(l=>byId(l.a===n.id?l.b:l.a)).filter(Boolean);
  if(n.type==="odp")return o.filter(x=>x.type==="cust").length;
  if(n.type==="odc")return o.filter(x=>x.type==="odp").length;return o.length;}
function sample(){
  const N=(type,name,lat,lng,cap)=>({id:S.seq++,type,name,lat,lng,cap});
  S={nodes:[],links:[],seq:1};
  const o=N("odc","ODC-01",-6.2,106.8,8), p1=N("odp","ODP-01",-6.2012,106.8018,8), p2=N("odp","ODP-02",-6.199,106.8025,8), p3=N("odp","ODP-03",-6.202,106.7985,4);
  const cs=[["Budi",-6.2016,106.8026,p1],["Sari",-6.2008,106.8024,p1],["Andi",-6.1986,106.8034,p2],["Dewi",-6.1996,106.8031,p2],["Rina",-6.2026,106.7978,p3],["Joko",-6.2024,106.7992,p3]].map(c=>[N("cust",c[0],c[1],c[2]),c[3]]);
  S.nodes=[o,p1,p2,p3,...cs.map(c=>c[0])];
  S.links=[{a:o.id,b:p1.id,k:"dist"},{a:o.id,b:p2.id,k:"dist"},{a:o.id,b:p3.id,k:"dist"},...cs.map(c=>({a:c[1].id,b:c[0].id,k:"drop"}))];
  V={x:0,y:0,s:220000};sel=null;from=null;
}
function save(){try{localStorage.setItem("ftth-map",JSON.stringify(S))}catch(e){}}
function load(){try{const t=localStorage.getItem("ftth-map");if(t){const d=JSON.parse(t);if(Array.isArray(d.nodes)&&Array.isArray(d.links)){S=d;return true}}}catch(e){}return false}
function resize(){const r=cv.parentElement.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);draw()}
function draw(){
  ctx.fillStyle=css("--bg");ctx.fillRect(0,0,W,H);
  const a=s2w(0,H),b=s2w(W,0),st=[5e-5,1e-4,5e-4,1e-3,5e-3,1e-2,5e-2].find(s=>s*V.s>70)||0.1;
  ctx.strokeStyle=css("--grid");ctx.fillStyle=css("--mut");ctx.lineWidth=1;ctx.font="10px system-ui";
  for(let g=Math.ceil(a.lng/st)*st;g<b.lng;g+=st){const x=w2s(0,g)[0];ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();ctx.fillText(g.toFixed(4),x+2,H-4)}
  for(let g=Math.ceil(a.lat/st)*st;g<b.lat;g+=st){const y=w2s(g,0)[1];ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();ctx.fillText(g.toFixed(4),4,y-2)}
  for(const l of S.links){const p=byId(l.a),q=byId(l.b);if(!p||!q)continue;const A=w2s(p.lat,p.lng),B=w2s(q.lat,q.lng),k=K[l.k]||K.dist;
    ctx.strokeStyle=k.c;ctx.lineWidth=k.w;ctx.beginPath();ctx.moveTo(...A);ctx.lineTo(...B);ctx.stroke()}
  ctx.font="11px system-ui";
  for(const n of S.nodes){const [x,y]=w2s(n.lat,n.lng),t=T[n.type],r=n.type==="cust"?5:n.type==="pole"?4:8;
    ctx.fillStyle=t.c;ctx.beginPath();
    if(n.type==="odc")ctx.rect(x-r,y-r,2*r,2*r);else if(n.type==="pole"){ctx.moveTo(x,y-r-1);ctx.lineTo(x+r+1,y);ctx.lineTo(x,y+r+1);ctx.lineTo(x-r-1,y)}
    else if(n.type==="jc"){ctx.moveTo(x,y-r);ctx.lineTo(x+r,y+r);ctx.lineTo(x-r,y+r)}else ctx.arc(x,y,r,0,7);
    ctx.fill();
    if(sel===n.id||from===n.id){ctx.strokeStyle=css("--ac");ctx.lineWidth=2;ctx.setLineDash(from===n.id?[4,3]:[]);ctx.beginPath();ctx.arc(x,y,r+5,0,7);ctx.stroke();ctx.setLineDash([])}
    ctx.fillStyle=css("--fg");let lb=n.name;if(n.cap){const u=used(n);lb+=" "+u+"/"+n.cap}
    ctx.fillText(lb,x+r+4,y+4);
  }
}
function panel(){
  const c={};S.nodes.forEach(n=>c[n.type]=(c[n.type]||0)+1);
  const len={};S.links.forEach(l=>{const p=byId(l.a),q=byId(l.b);if(p&&q)len[l.k]=(len[l.k]||0)+km(p,q)});
  let h=Object.keys(T).map(k=>'<div><span class="dot" style="background:'+T[k].c+'"></span>'+T[k].n+": "+(c[k]||0)+"</div>").join("");
  h+=Object.keys(K).map(k=>'<div style="color:var(--mut)">'+K[k].n+": "+((len[k]||0)*1000).toFixed(0)+" m</div>").join("");
  const full=S.nodes.filter(n=>n.cap&&used(n)>=n.cap);
  if(full.length)h+='<div class="warn">Penuh/over: '+full.map(n=>esc(n.name)).join(", ")+"</div>";
  $("#stats").innerHTML=h;
  const n=byId(sel);
  if(!n){$("#sel").textContent="Klik node pada mode Pilih.";return}
  $("#sel").innerHTML='<div class="row"><label>Tipe</label><span>'+T[n.type].n+'</span></div><div class="row"><label>Nama</label><input id="nm" value="'+esc(n.name)+'"></div>'
   +(n.type==="odp"||n.type==="odc"?'<div class="row"><label>Port</label><input id="cp" type="number" min="1" value="'+(n.cap||0)+'"></div><div class="row"><label>Terpakai</label><span>'+used(n)+"</span></div>":"")
   +'<div class="row"><label>Koordinat</label><span style="font-size:12px">'+n.lat.toFixed(6)+", "+n.lng.toFixed(6)+"</span></div>";
  $("#nm").oninput=e=>{n.name=e.target.value;draw();save()};
  if($("#cp"))$("#cp").onchange=e=>{n.cap=Math.max(1,+e.target.value||1);draw();panel();save()};
}
function refresh(){draw();panel();save()}
function hit(x,y){let b=null,d=14;for(const n of S.nodes){const [px,py]=w2s(n.lat,n.lng),e=Math.hypot(px-x,py-y);if(e<d){d=e;b=n}}return b}
function hitLink(x,y){for(const l of S.links){const p=byId(l.a),q=byId(l.b);if(!p||!q)continue;const A=w2s(p.lat,p.lng),B=w2s(q.lat,q.lng),dx=B[0]-A[0],dy=B[1]-A[1],
  t=Math.max(0,Math.min(1,((x-A[0])*dx+(y-A[1])*dy)/(dx*dx+dy*dy||1)));if(Math.hypot(A[0]+t*dx-x,A[1]+t*dy-y)<6)return l}return null}
function setMode(m){mode=m;from=null;document.querySelectorAll("[data-m]").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
  $("#hint").textContent=HINT[m]||"Klik peta untuk menaruh "+T[m].n+".";draw()}
function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener("pointerdown",e=>{
  const [x,y]=pos(e),h=hit(x,y);cv.setPointerCapture(e.pointerId);
  if(T[mode]){const w=s2w(x,y),c=T[mode].n;S.nodes.push({id:S.seq++,type:mode,name:c+"-"+String(S.nodes.filter(n=>n.type===mode).length+1).padStart(2,"0"),lat:w.lat,lng:w.lng,cap:mode==="odp"?8:mode==="odc"?16:0});sel=S.seq-1;refresh()}
  else if(mode==="link"){if(h){if(from&&from!==h.id){if(!S.links.some(l=>(l.a===from&&l.b===h.id)||(l.a===h.id&&l.b===from)))S.links.push({a:from,b:h.id,k:$("#kind").value});from=null;refresh()}else{from=h.id;draw()}}}
  else if(mode==="del"){if(h){S.nodes=S.nodes.filter(n=>n!==h);S.links=S.links.filter(l=>l.a!==h.id&&l.b!==h.id);if(sel===h.id)sel=null;refresh()}else{const l=hitLink(x,y);if(l){S.links=S.links.filter(k=>k!==l);refresh()}}}
  else{if(h){sel=h.id;drag={n:h};panel()}else{sel=null;drag={px:x,py:y,vx:V.x,vy:V.y};panel()}draw()}
});
cv.addEventListener("pointermove",e=>{if(!drag)return;const [x,y]=pos(e);
  if(drag.n){const w=s2w(x,y);drag.n.lat=w.lat;drag.n.lng=w.lng}else{V.x=drag.vx-(x-drag.px)/V.s;V.y=drag.vy-(y-drag.py)/V.s}draw()});
cv.addEventListener("pointerup",()=>{if(drag&&drag.n)refresh();drag=null});
cv.addEventListener("wheel",e=>{e.preventDefault();const [x,y]=pos(e),w=s2w(x,y),f=e.deltaY<0?1.15:1/1.15;
  V.s=Math.max(2000,Math.min(5e7,V.s*f));const q=s2w(x,y);V.x+=((w.lng-q.lng)*CL);V.y+=-(w.lat-q.lat);draw()},{passive:false});
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
$("#exp").onclick=()=>{$("#j").value=JSON.stringify(S,null,1);$("#msg").textContent="Salin teks di atas untuk disimpan."};
$("#imp").onclick=()=>{try{const d=JSON.parse($("#j").value);if(!Array.isArray(d.nodes)||!Array.isArray(d.links))throw 0;S=d;S.seq=S.seq||Math.max(0,...S.nodes.map(n=>n.id))+1;sel=null;from=null;refresh();$("#msg").textContent="Data dimuat."}catch(e){$("#msg").textContent="JSON tidak valid."}};
$("#rst").onclick=()=>{sample();refresh();$("#msg").textContent="Data contoh dimuat."};
addEventListener("resize",resize);
if(!load())sample();
setMode("select");resize();panel();
</script>
</body>
</html>
